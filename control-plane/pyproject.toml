[project]
name = "utp-control-plane"
version = "0.1.0"
description = "Unified Test Platform 控制面（FastAPI）"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "utp-shared",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
pg = ["psycopg2-binary>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utp_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
