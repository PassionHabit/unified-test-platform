[project]
name = "utp-agent"
version = "0.1.0"
description = "Unified Test Platform Agent（Docker/Native 执行器）"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "utp-shared"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utp_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
